<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapeutic Hub - Clinic Portal</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat Libraries for easy CDN usage -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        /* Custom print styles to maximize page space and ensure clean rendering */
        @media print {
            body { background-color: white !important; }
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:p-0 { padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; }
        }
        
        /* Loading Spinner Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-sm md:text-base">
    <div id="root"></div>

    <script type="text/babel">

        // =====================================================================
        // ⚠️ FIREBASE CONFIGURATION ⚠️ 
        // You MUST replace these values with your actual Firebase config keys!
        // =====================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "clinic-bdf92.firebaseapp.com",
            databaseURL: "https://clinic-bdf92-default-rtdb.firebaseio.com",
            projectId: "clinic-bdf92",
            storageBucket: "clinic-bdf92.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase Authentication
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const { useState, useEffect, useMemo } = React;

        // --- CLOUD CREDENTIALS ---
        const FIREBASE_DB_URL = "https://clinic-bdf92-default-rtdb.firebaseio.com/exercises";
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dyunl0dx5/auto/upload";
        const CLOUDINARY_UPLOAD_PRESET = "unsigned_preset"; // You must create this in Cloudinary settings

        // --- SVGs for Icons ---
        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            Search: ({className="absolute left-3 top-2.5 text-slate-400 w-4 h-4 md:w-5 md:h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            ArrowLeft: ({className="h-5 w-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            PlayCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,
            Stethoscope: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600 mr-2 md:w-6 md:h-6"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>,
            Database: ({className="w-4 h-4 md:w-5 md:h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Printer: ({className="h-4 w-4 md:h-5 md:w-5 mr-2"}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect width="12" height="8" x="6" y="14"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>,
            Google: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px" className="mr-2"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        };

        const INITIAL_EXERCISES = [
            { id: 1, name: "Pelvic Tilt", description: "Lie on your back with knees bent. Tighten your stomach muscles, flattening your lower back against the floor. Hold for 5 seconds.", imageUrl: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&q=80&w=400", videoUrl: "", tags: ["low back pain", "core", "lumbar"] },
            { id: 2, name: "Knee to Chest Stretch", description: "Lie on your back. Pull one knee up to your chest until you feel a stretch in your lower back. Hold for 15-30 seconds. Repeat with the other leg.", imageUrl: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&q=80&w=400", videoUrl: "", tags: ["low back pain", "stretching", "sciatica"] }
        ];

        function App() {
            // --- AUTH & NAVIGATION STATE ---
            const [user, setUser] = useState({ role: 'guest' }); // guest, patient, doctor
            const [currentView, setCurrentView] = useState('exercise-list'); // Default view
            const [showLoginModal, setShowLoginModal] = useState(false);
            
            // --- DATA STATE ---
            const [exercises, setExercises] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [isUploading, setIsUploading] = useState(false);
            
            // --- SEARCH STATES ---
            const [selectedExercise, setSelectedExercise] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [doctorSearchQuery, setDoctorSearchQuery] = useState("");
            const [databaseSearchQuery, setDatabaseSearchQuery] = useState("");

            // --- FORM STATES ---
            const [editingId, setEditingId] = useState(null);
            const [newExercise, setNewExercise] = useState({ name: '', description: '', imageUrl: '', videoUrl: '', tags: '' });
            const [prescriptionData, setPrescriptionData] = useState({ 
                patientName: '', age: '', gender: '', notes: '', selectedExerciseIds: [], exerciseParams: {} 
            });

            // --- FIREBASE SYNC & AUTH LISTENER ON LOAD ---
            useEffect(() => {
                fetchExercisesFromFirebase();

                // Listen for Google Auth changes
                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    if (firebaseUser) {
                        setUser({ role: 'doctor', name: firebaseUser.displayName, email: firebaseUser.email });
                        setCurrentView('doctor-dashboard');
                        setShowLoginModal(false);
                    }
                });

                return () => unsubscribe();
            }, []);

            const fetchExercisesFromFirebase = async () => {
                try {
                    setIsLoading(true);
                    const res = await fetch(`${FIREBASE_DB_URL}.json`);
                    const data = await res.json();
                    if (data) {
                        const exArray = Object.keys(data).map(key => ({ ...data[key], id: key }));
                        setExercises(exArray.reverse()); 
                    } else {
                        // Fallback to initial data if database is empty
                        setExercises(INITIAL_EXERCISES);
                    }
                } catch (error) {
                    console.error("Error fetching from Firebase:", error);
                    // Use mock data if API call fails
                    setExercises(INITIAL_EXERCISES);
                } finally {
                    setIsLoading(false);
                }
            };

            // --- LOGOUT HANDLER ---
            const handleLogout = async () => {
                if (user.role === 'doctor') {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error("Error signing out:", error);
                    }
                }
                setUser({role: 'guest'});
                setCurrentView('exercise-list');
            };

            // --- CLOUDINARY UPLOAD HANDLER ---
            const uploadFileToCloudinary = async (file) => {
                setIsUploading(true);
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                try {
                    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.secure_url) {
                        setIsUploading(false);
                        return data.secure_url;
                    } else {
                        throw new Error(data.error?.message || "Upload Failed");
                    }
                } catch (err) {
                    setIsUploading(false);
                    console.error("Cloudinary Error:", err);
                    alert("Cloudinary upload failed. Check the setup instructions. Using temporary local preview instead.");
                    return URL.createObjectURL(file);
                }
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const secureUrl = await uploadFileToCloudinary(file);
                    setNewExercise({ ...newExercise, imageUrl: secureUrl });
                }
            };

            const handleVideoUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const secureUrl = await uploadFileToCloudinary(file);
                    setNewExercise({ ...newExercise, videoUrl: secureUrl });
                }
            };

            // --- FIREBASE WRITE HANDLERS ---
            const handleAddOrUpdateExercise = async (e) => {
                e.preventDefault();
                
                const tagsArray = typeof newExercise.tags === 'string' 
                    ? newExercise.tags.split(',').map(t => t.trim().toLowerCase()).filter(t => t) 
                    : newExercise.tags;
                    
                let finalImageUrl = newExercise.imageUrl || 'https://images.unsplash.com/photo-1576091160550-2173ff9e5ee5?auto=format&fit=crop&q=80&w=400';
                
                const exerciseData = {
                    name: newExercise.name,
                    description: newExercise.description,
                    imageUrl: finalImageUrl,
                    videoUrl: newExercise.videoUrl,
                    tags: tagsArray
                };

                setIsLoading(true);

                try {
                    if (editingId) {
                        await fetch(`${FIREBASE_DB_URL}/${editingId}.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(exerciseData)
                        });
                        alert("Exercise updated securely in Cloud!");
                    } else {
                        await fetch(`${FIREBASE_DB_URL}.json`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(exerciseData)
                        });
                        alert("Exercise added securely to Cloud!");
                    }
                    
                    setEditingId(null);
                    setNewExercise({ name: '', description: '', imageUrl: '', videoUrl: '', tags: '' });
                    await fetchExercisesFromFirebase();
                } catch (error) {
                    console.error("Firebase write error:", error);
                    alert("Failed to save to database. Make sure your API key is correct.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleDeleteClick = async (id) => {
                if (window.confirm("Delete this exercise? This will permanently remove it from the Cloud Database.")) {
                    setIsLoading(true);
                    try {
                        await fetch(`${FIREBASE_DB_URL}/${id}.json`, { method: 'DELETE' });
                        
                        setPrescriptionData(prev => {
                            const newIds = prev.selectedExerciseIds.filter(eId => eId !== id);
                            const newParams = { ...prev.exerciseParams };
                            delete newParams[id];
                            return { ...prev, selectedExerciseIds: newIds, exerciseParams: newParams };
                        });
                        
                        if (editingId === id) cancelEdit();
                        await fetchExercisesFromFirebase();
                    } catch (error) {
                        console.error("Firebase delete error:", error);
                        alert("Failed to delete exercise.");
                    } finally {
                        setIsLoading(false);
                    }
                }
            };

            const cancelEdit = () => {
                setEditingId(null);
                setNewExercise({ name: '', description: '', imageUrl: '', videoUrl: '', tags: '' });
            };

            // --- PRESCRIPTION HANDLERS ---
            const togglePrescriptionExercise = (id) => {
                setPrescriptionData(prev => {
                    const isSelected = prev.selectedExerciseIds.includes(id);
                    let newIds = [...prev.selectedExerciseIds];
                    let newParams = { ...prev.exerciseParams };

                    if (isSelected) {
                        newIds = newIds.filter(eId => eId !== id);
                        delete newParams[id];
                    } else {
                        newIds.push(id);
                        newParams[id] = { reps: '10', sets: '3', freq: '2x/Day', note: '' };
                    }
                    return { ...prev, selectedExerciseIds: newIds, exerciseParams: newParams };
                });
            };

            const handleParamChange = (id, field, value) => {
                setPrescriptionData(prev => ({
                    ...prev, exerciseParams: { ...prev.exerciseParams, [id]: { ...prev.exerciseParams[id], [field]: value } }
                }));
            };

            // --- FILTERS ---
            const filteredPatientExercises = useMemo(() => exercises.filter(ex => ex.name.toLowerCase().includes(searchQuery.toLowerCase()) || (ex.tags && ex.tags.some(tag => tag.includes(searchQuery.toLowerCase())))), [exercises, searchQuery]);
            const filteredDoctorExercises = useMemo(() => exercises.filter(ex => ex.name.toLowerCase().includes(doctorSearchQuery.toLowerCase()) || (ex.tags && ex.tags.some(tag => tag.includes(doctorSearchQuery.toLowerCase())))), [exercises, doctorSearchQuery]);
            const filteredDatabaseExercises = useMemo(() => exercises.filter(ex => ex.name.toLowerCase().includes(databaseSearchQuery.toLowerCase()) || (ex.tags && ex.tags.some(tag => tag.includes(databaseSearchQuery.toLowerCase())))), [exercises, databaseSearchQuery]);


            // --- RENDER COMPONENTS ---

            const renderHeader = () => (
                <div className="bg-white px-3 py-3 shadow-sm flex items-center justify-between sticky top-0 z-50 print:hidden border-b border-slate-200">
                    <div className="flex items-center space-x-1.5 cursor-pointer" onClick={() => setCurrentView(user.role === 'doctor' ? 'doctor-dashboard' : 'exercise-list')}>
                        <Icons.Activity />
                        <span className="font-bold text-lg md:text-xl text-slate-800">Therapeutic Hub</span>
                    </div>
                    
                    <div className="flex items-center space-x-2">
                        {user.role === 'guest' && (
                            <button onClick={() => setShowLoginModal(true)} className="flex items-center bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700 transition">
                                <Icons.User /> Login
                            </button>
                        )}

                        {user.role === 'patient' && (
                            <div className="flex items-center space-x-3">
                                <span className="text-xs md:text-sm font-semibold text-slate-600 hidden sm:block">Patient: {user.phone}</span>
                                <button onClick={handleLogout} className="flex items-center text-slate-500 hover:text-red-600 font-semibold text-sm transition">
                                    <Icons.LogOut /> Logout
                                </button>
                            </div>
                        )}

                        {user.role === 'doctor' && (
                            <div className="flex items-center space-x-2 md:space-x-4">
                                <button onClick={() => setCurrentView(currentView === 'database-management' ? 'doctor-dashboard' : 'database-management')} className={`flex items-center justify-center p-1.5 md:px-3 md:py-1.5 rounded-lg font-bold text-xs md:text-sm transition ${currentView === 'database-management' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                    <Icons.Database className="w-4 h-4 md:mr-1.5" /> <span className="hidden md:inline">{currentView === 'database-management' ? 'Dashboard' : 'Database'}</span>
                                </button>
                                <button onClick={handleLogout} className="flex items-center text-slate-500 hover:text-red-600 font-semibold text-sm transition">
                                    <Icons.LogOut /> <span className="hidden sm:inline">Logout</span>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderLoginModal = () => {
                if (!showLoginModal) return null;
                
                const [tab, setTab] = useState('patient'); // patient | doctor
                const [loginPhone, setLoginPhone] = useState('');

                const handlePatientLogin = (e) => {
                    e.preventDefault();
                    if (loginPhone.length >= 10) {
                        setUser({ role: 'patient', phone: loginPhone });
                        setShowLoginModal(false);
                    } else {
                        alert("Please enter a valid mobile number.");
                    }
                };

                const handleDoctorGoogleLogin = async () => {
                    try {
                        await auth.signInWithPopup(googleProvider);
                        // Auth listener handles the rest
                    } catch (error) {
                        console.error("Google Login Error:", error);
                        alert("Failed to log in with Google. Make sure you added your Firebase Config keys and enabled Google Sign-In in your Firebase Console.");
                    }
                };

                return (
                    <div className="fixed inset-0 bg-slate-900 bg-opacity-50 z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
                            <div className="flex border-b border-slate-100">
                                <button onClick={() => setTab('patient')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition ${tab === 'patient' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>Patient Login</button>
                                <button onClick={() => setTab('doctor')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition ${tab === 'doctor' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>Doctor Login</button>
                            </div>
                            
                            <div className="p-6">
                                {tab === 'patient' ? (
                                    <form onSubmit={handlePatientLogin}>
                                        <div className="mb-6">
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Registered Mobile Number</label>
                                            <input type="tel" required placeholder="e.g. 9876543210" value={loginPhone} onChange={(e) => setLoginPhone(e.target.value)} className="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
                                            <p className="text-xs text-slate-400 mt-2">Log in to view your prescribed plans.</p>
                                        </div>
                                        <div className="flex space-x-3">
                                            <button type="button" onClick={() => setShowLoginModal(false)} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition">Cancel</button>

                            <div className="flex-1">
                                <div className="grid grid-cols-3 gap-x-6 gap-y-10">
                                    {prescribedExercises.map((ex) => {
                                        const params = prescriptionData.exerciseParams[ex.id] || {};
                                        const customNote = params.note;
                                        
                                        return (
                                            <div key={ex.id} className="flex flex-col items-start break-inside-avoid text-left">
                                                <div className="h-32 sm:h-40 w-full flex items-center justify-center mb-2">
                                                    <img src={ex.imageUrl} alt={ex.name} className="max-w-full max-h-full object-contain mix-blend-multiply" />
                                                </div>
                                                <div className="w-full px-1 text-left">
                                                    <h4 className="font-bold text-slate-800 text-[12px] mb-1 text-left">{ex.name}</h4>
                                                    
                                                    <div className="flex justify-start items-center space-x-3 text-[9px] font-bold text-[#1e3a8a] mb-1">
                                                        {params.reps && <span>Reps: <span className="text-black">{params.reps}</span></span>}
                                                        {params.sets && <span>Sets: <span className="text-black">{params.sets}</span></span>}
                                                        {params.freq && <span>Freq: <span className="text-black">{params.freq}</span></span>}
                                                    </div>
                                                    
                                                    {customNote && (
                                                        <p className="text-[9px] text-slate-600 leading-tight font-medium text-left">{customNote}</p>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <main>
                    {renderHeader()}
                    {renderLoginModal()}
                    {currentView === 'exercise-list' && renderPatientExerciseList()}
                    {currentView === 'exercise-detail' && renderPatientExerciseDetail()}
                    {currentView === 'doctor-dashboard' && user.role === 'doctor' && renderDoctorDashboard()}
                    {currentView === 'database-management' && user.role === 'doctor' && renderDatabaseManagement()}
                    {currentView === 'print-prescription' && user.role === 'doctor' && renderPrintPrescriptionView()}
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
