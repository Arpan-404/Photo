<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapeutic Hub - Exercise Prototype</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel for in-browser compilation -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom print styles to ensure backgrounds and formatting look perfect when generating the PDF */
        @media print {
            body { background-color: white !important; }
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:p-0 { padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- SVGs for Icons (Replacing Lucide-React for pure HTML compatibility) ---
        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute left-3 top-3 text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            ArrowLeft: ({className="h-5 w-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            Video: () => <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute -right-4 -bottom-4 text-blue-500 opacity-30"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>,
            PlayCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,
            Stethoscope: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600 mr-2"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Printer: ({className="h-5 w-5 mr-2"}) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-1"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        };

        // --- MOCK DATA ---
        const INITIAL_EXERCISES = [
            { id: 1, name: "Pelvic Tilt", description: "Lie on your back with knees bent. Tighten your stomach muscles, flattening your lower back against the floor. Hold for 5 seconds.", imageUrl: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&q=80&w=400", tags: ["low back pain", "core", "lumbar"] },
            { id: 2, name: "Knee to Chest Stretch", description: "Lie on your back. Pull one knee up to your chest until you feel a stretch in your lower back. Hold for 15-30 seconds. Repeat with the other leg.", imageUrl: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&q=80&w=400", tags: ["low back pain", "stretching", "sciatica"] },
            { id: 3, name: "Straight Leg Raise", description: "Lie on your back with one leg straight and the other bent. Tighten the thigh muscle of your straight leg and slowly lift it 6-10 inches off the floor.", imageUrl: "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&q=80&w=400", tags: ["knee pain", "post-op", "ACL"] },
            { id: 4, name: "Glute Bridge", description: "Lie on your back with knees bent and feet flat on the floor. Lift your hips off the floor until your knees, hips and shoulders form a straight line.", imageUrl: "https://images.unsplash.com/photo-1588286840104-8957b019727f?auto=format&fit=crop&q=80&w=400", tags: ["glutes", "low back pain", "core"] },
            { id: 5, name: "Clamshells", description: "Lie on your side with knees bent. Keeping your feet together, raise your top knee as high as you can without moving your pelvis.", imageUrl: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&q=80&w=400", tags: ["hip", "glutes", "IT band"] },
            { id: 6, name: "Wall Squats", description: "Stand with your back against a wall. Slowly slide down until your knees are bent at a 45-90 degree angle. Hold for 5 seconds, then slide back up.", imageUrl: "https://images.unsplash.com/photo-1566241142559-40e1dab266c6?auto=format&fit=crop&q=80&w=400", tags: ["knee", "quads", "strengthening"] },
            { id: 7, name: "Calf Stretch", description: "Stand facing a wall with one foot forward and one foot back. Keep the back leg straight and heel on the floor. Lean forward into the wall.", imageUrl: "https://images.unsplash.com/photo-1554286393-27fb62ba1e98?auto=format&fit=crop&q=80&w=400", tags: ["ankle", "calf", "achilles"] },
            { id: 8, name: "Bird Dog", description: "On all fours, extend one arm forward and the opposite leg backward. Keep your back straight. Hold for a few seconds, then switch sides.", imageUrl: "https://images.unsplash.com/photo-1599058917212-d750089bc07e?auto=format&fit=crop&q=80&w=400", tags: ["core", "low back pain", "balance"] },
            { id: 9, name: "Cat-Cow Stretch", description: "Start on your hands and knees. Arch your back up towards the ceiling (Cat), then drop your belly down towards the floor (Cow).", imageUrl: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&q=80&w=400", tags: ["spine", "mobility", "low back pain"] },
            { id: 10, name: "Heel Slides", description: "Lie on your back with legs straight. Slowly slide one heel towards your buttocks, bending the knee. Slowly slide it back out.", imageUrl: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&q=80&w=400", tags: ["knee", "post-op", "mobility"] }
        ];

        function App() {
            const [role, setRole] = useState('doctor'); 
            const [currentView, setCurrentView] = useState('doctor-dashboard'); 
            const [exercises, setExercises] = useState(INITIAL_EXERCISES);
            
            const [selectedExercise, setSelectedExercise] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");

            const [newExercise, setNewExercise] = useState({ name: '', description: '', imageUrl: '', tags: '' });
            const [prescriptionData, setPrescriptionData] = useState({ patientName: '', age: '', gender: '', complaint: '', selectedExerciseIds: [] });

            const handleAddExercise = (e) => {
                e.preventDefault();
                const newId = exercises.length > 0 ? Math.max(...exercises.map(e => e.id)) + 1 : 1;
                const tagsArray = newExercise.tags.split(',').map(t => t.trim().toLowerCase());
                setExercises([...exercises, { ...newExercise, id: newId, tags: tagsArray }]);
                setNewExercise({ name: '', description: '', imageUrl: '', tags: '' });
                alert("Exercise added successfully!");
            };

            const togglePrescriptionExercise = (id) => {
                setPrescriptionData(prev => {
                    const isSelected = prev.selectedExerciseIds.includes(id);
                    return { ...prev, selectedExerciseIds: isSelected ? prev.selectedExerciseIds.filter(eId => eId !== id) : [...prev.selectedExerciseIds, id] };
                });
            };

            const filteredExercises = useMemo(() => {
                return exercises.filter(ex => 
                    ex.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    ex.tags.some(tag => tag.includes(searchQuery.toLowerCase()))
                );
            }, [exercises, searchQuery]);

            const Header = () => (
                <div className="bg-white px-4 py-3 shadow-sm flex items-center justify-between sticky top-0 z-50 print:hidden">
                    <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentView('home')}>
                        <Icons.Activity />
                        <span className="font-bold text-xl text-slate-800 hidden sm:block">Therapeutic Hub</span>
                    </div>
                    <div className="flex bg-slate-100 p-1 rounded-lg">
                        <button className={`px-3 py-1 text-sm rounded-md transition-colors ${role === 'patient' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'}`} onClick={() => { setRole('patient'); setCurrentView('home'); }}>Patient</button>
                        <button className={`px-3 py-1 text-sm rounded-md transition-colors ${role === 'doctor' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'}`} onClick={() => { setRole('doctor'); setCurrentView('doctor-dashboard'); }}>Doctor</button>
                    </div>
                    <button className="p-2 text-slate-600 hover:bg-slate-100 rounded-full"><Icons.Menu /></button>
                </div>
            );

            const HomeView = () => (
                <div className="p-4 space-y-6 max-w-4xl mx-auto pb-20">
                    <div className="relative">
                        <Icons.Search />
                        <input type="text" placeholder="Search..." className="w-full bg-slate-100 rounded-full py-2.5 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div onClick={() => setCurrentView('exercise-list')} className="bg-blue-600 rounded-2xl p-6 text-white shadow-md cursor-pointer hover:bg-blue-700 transition relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-2xl font-bold mb-2">Exercise Library</h2>
                            <p className="text-blue-100 mb-4 max-w-[80%]">View your prescribed exercises, read instructions, and watch guided videos.</p>
                            <div className="inline-flex items-center bg-white text-blue-600 px-4 py-2 rounded-full font-semibold text-sm">
                                View Exercises <Icons.ArrowLeft className="ml-2 h-4 w-4 rotate-180" />
                            </div>
                        </div>
                        <Icons.Video />
                    </div>
                    <div>
                        <h3 className="text-xl font-bold text-slate-800 mb-4">What We Offer</h3>
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                            <div className="w-24 h-24 bg-slate-200 rounded-xl overflow-hidden shrink-0">
                                <img src="https://images.unsplash.com/photo-1576091160550-2173ff9e5ee5?auto=format&fit=crop&q=80&w=200" alt="Consultation" className="w-full h-full object-cover"/>
                            </div>
                            <div>
                                <h4 className="font-bold text-slate-800">Free Physiotherapy Consultation</h4>
                                <p className="text-sm text-slate-500 mt-1 mb-2">Physical-therapy and rehab by experts.</p>
                                <span className="text-blue-600 text-sm font-semibold">View Details & Book →</span>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const PatientExerciseList = () => (
                <div className="p-4 max-w-4xl mx-auto pb-20">
                    <div className="flex items-center mb-6">
                        <button onClick={() => setCurrentView('home')} className="p-2 mr-2 bg-slate-100 rounded-full text-slate-600"><Icons.ArrowLeft /></button>
                        <h2 className="text-2xl font-bold text-slate-800">Exercise Library</h2>
                    </div>
                    <div className="relative mb-6">
                        <Icons.Search />
                        <input type="text" placeholder="Search by name or symptom" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredExercises.map(ex => (
                            <div key={ex.id} onClick={() => { setSelectedExercise(ex); setCurrentView('exercise-detail'); }} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden cursor-pointer hover:shadow-md transition flex flex-col sm:flex-row">
                                <div className="h-48 sm:h-auto sm:w-1/3 relative">
                                    <img src={ex.imageUrl} alt={ex.name} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-black bg-opacity-20 flex items-center justify-center"><Icons.PlayCircle className="text-white opacity-80" /></div>
                                </div>
                                <div className="p-4 sm:w-2/3 flex flex-col justify-between">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-800 mb-1">{ex.name}</h3>
                                        <p className="text-sm text-slate-500 line-clamp-2">{ex.description}</p>
                                    </div>
                                    <div className="mt-3 flex flex-wrap gap-1">
                                        {ex.tags.map(tag => <span key={tag} className="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded-md font-medium">{tag}</span>)}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const PatientExerciseDetail = () => {
                if (!selectedExercise) return null;
                return (
                    <div className="p-4 max-w-3xl mx-auto pb-20">
                        <button onClick={() => setCurrentView('exercise-list')} className="flex items-center text-blue-600 font-semibold mb-4"><Icons.ArrowLeft className="h-5 w-5 mr-1" /> Back to Exercises</button>
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="aspect-video bg-slate-900 relative flex items-center justify-center">
                                <img src={selectedExercise.imageUrl} alt={selectedExercise.name} className="absolute inset-0 w-full h-full object-cover opacity-50" />
                                <Icons.PlayCircle className="text-white z-10 cursor-pointer hover:scale-110 transition-transform w-16 h-16" />
                            </div>
                            <div className="p-6">
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">{selectedExercise.name}</h2>
                                <p className="text-slate-600 leading-relaxed whitespace-pre-line">{selectedExercise.description}</p>
                            </div>
                        </div>
                    </div>
                );
            };

            const DoctorDashboard = () => (
                <div className="p-4 max-w-5xl mx-auto pb-20">
                    <div className="flex items-center mb-6">
                        <Icons.Stethoscope />
                        <h2 className="text-2xl font-bold text-slate-800">Doctor Dashboard</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Prescription Card */}
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 order-2 md:order-1">
                            <h3 className="text-lg font-bold text-slate-800 mb-1">Generate Prescription</h3>
                            <p className="text-sm text-slate-500 mb-6">Select exercises to create a printable PDF sheet.</p>
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" placeholder="Patient Name" value={prescriptionData.patientName} onChange={e => setPrescriptionData({...prescriptionData, patientName: e.target.value})} className="col-span-2 text-sm border border-slate-200 rounded-lg p-2" />
                                    <input type="number" placeholder="Age" value={prescriptionData.age} onChange={e => setPrescriptionData({...prescriptionData, age: e.target.value})} className="text-sm border border-slate-200 rounded-lg p-2" />
                                    <select value={prescriptionData.gender} onChange={e => setPrescriptionData({...prescriptionData, gender: e.target.value})} className="text-sm border border-slate-200 rounded-lg p-2 bg-white">
                                        <option value="">Gender</option><option value="M">Male</option><option value="F">Female</option>
                                    </select>
                                    <input type="text" placeholder="Diagnosis" value={prescriptionData.complaint} onChange={e => setPrescriptionData({...prescriptionData, complaint: e.target.value})} className="col-span-2 text-sm border border-slate-200 rounded-lg p-2" />
                                </div>
                                <div className="mt-4 border-t border-slate-100 pt-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-semibold text-sm text-slate-700">Select Exercises</h4>
                                        <span className="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded">{prescriptionData.selectedExerciseIds.length} Selected</span>
                                    </div>
                                    <div className="h-64 overflow-y-auto space-y-2 border border-slate-100 rounded-lg p-2 bg-slate-50">
                                        {exercises.map(ex => (
                                            <label key={ex.id} className={`flex items-start p-2 rounded-lg cursor-pointer transition-colors border ${prescriptionData.selectedExerciseIds.includes(ex.id) ? 'bg-blue-50 border-blue-200' : 'bg-white border-transparent hover:bg-slate-100'}`}>
                                                <input type="checkbox" className="mt-1 rounded text-blue-600 focus:ring-blue-500" checked={prescriptionData.selectedExerciseIds.includes(ex.id)} onChange={() => togglePrescriptionExercise(ex.id)} />
                                                <div className="ml-3 flex-1">
                                                    <p className="text-sm font-semibold text-slate-800">{ex.name}</p>
                                                    <p className="text-xs text-slate-500 line-clamp-1">{ex.tags.join(', ')}</p>
                                                </div>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => setCurrentView('print-prescription')} disabled={prescriptionData.selectedExerciseIds.length === 0} className="w-full mt-4 bg-blue-600 text-white rounded-xl py-3 font-bold shadow hover:bg-blue-700 transition flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                                    <Icons.Printer /> Generate Printable Sheet
                                </button>
                            </div>
                        </div>

                        {/* Database Card */}
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 order-1 md:order-2">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-bold text-slate-800">Exercise Database</h3>
                                <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-full">{exercises.length} Total</span>
                            </div>
                            <form onSubmit={handleAddExercise} className="space-y-4 mb-6 bg-slate-50 p-4 rounded-xl">
                                <h4 className="font-semibold text-sm text-slate-700">Add New Exercise</h4>
                                <input required type="text" placeholder="Exercise Name" value={newExercise.name} onChange={e => setNewExercise({...newExercise, name: e.target.value})} className="w-full text-sm border-slate-200 rounded-lg p-2" />
                                <textarea required placeholder="Description" value={newExercise.description} onChange={e => setNewExercise({...newExercise, description: e.target.value})} className="w-full text-sm border-slate-200 rounded-lg p-2" rows="2" />
                                <input required type="url" placeholder="Image URL" value={newExercise.imageUrl} onChange={e => setNewExercise({...newExercise, imageUrl: e.target.value})} className="w-full text-sm border-slate-200 rounded-lg p-2" />
                                <input type="text" placeholder="Tags (comma separated)" value={newExercise.tags} onChange={e => setNewExercise({...newExercise, tags: e.target.value})} className="w-full text-sm border-slate-200 rounded-lg p-2" />
                                <button type="submit" className="w-full bg-slate-800 text-white rounded-lg py-2 text-sm font-semibold hover:bg-slate-700 flex items-center justify-center">
                                    <Icons.Plus /> Save Exercise
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );

            const PrintPrescriptionView = () => {
                const prescribedExercises = exercises.filter(ex => prescriptionData.selectedExerciseIds.includes(ex.id));
                const count = prescribedExercises.length;
                const today = new Date().toLocaleDateString('en-GB');

                const getGridConfig = (c) => {
                    if (c <= 2) return { gridClass: 'grid-cols-1 gap-6', layout: 'row', imgClass: 'w-1/3 h-48 sm:border-r border-slate-200 border-b-0', textClass: 'text-sm mb-4', titleClass: 'text-lg mb-2', repsClass: 'p-3 text-sm' };
                    if (c <= 4) return { gridClass: 'grid-cols-2 gap-4', layout: 'col', imgClass: 'w-full h-48 border-b border-slate-200', textClass: 'text-sm mb-3 line-clamp-4', titleClass: 'text-base mb-1', repsClass: 'p-2 text-xs' };
                    if (c <= 6) return { gridClass: 'grid-cols-2 gap-4', layout: 'col', imgClass: 'w-full h-40 border-b border-slate-200', textClass: 'text-xs mb-2 line-clamp-3', titleClass: 'text-sm mb-1', repsClass: 'p-2 text-xs' };
                    return { gridClass: 'grid-cols-3 gap-3', layout: 'col', imgClass: 'w-full h-28 border-b border-slate-200', textClass: 'text-[11px] leading-snug mb-2 line-clamp-3', titleClass: 'text-xs font-bold mb-1', repsClass: 'p-1 text-[10px]' };
                };

                const config = getGridConfig(count);

                return (
                    <div className="bg-slate-200 min-h-screen pt-8 pb-20 print:bg-white print:p-0">
                        <div className="max-w-4xl mx-auto mb-4 flex justify-between items-center print:hidden px-4">
                            <button onClick={() => setCurrentView('doctor-dashboard')} className="flex items-center text-slate-600 hover:text-slate-800 font-semibold bg-white px-4 py-2 rounded-lg shadow-sm"><Icons.ArrowLeft className="h-5 w-5 mr-1" /> Edit</button>
                            <button onClick={() => window.print()} className="flex items-center text-white bg-blue-600 hover:bg-blue-700 font-semibold px-6 py-2 rounded-lg shadow-sm"><Icons.Printer /> Print to PDF</button>
                        </div>
                        <div className="bg-white max-w-[21cm] min-h-[29.7cm] mx-auto shadow-lg print:shadow-none p-8 sm:p-12 text-slate-900 flex flex-col">
                            <div className="flex justify-between items-start border-b-2 border-blue-800 pb-4 mb-6">
                                <div>
                                    <h1 className="text-3xl font-bold text-blue-800 italic">Dr. Arpan Das (PT)</h1>
                                    <p className="text-blue-700 font-semibold text-sm">BPT (KPC Medical College and Hospital)</p>
                                    <p className="text-blue-700 font-semibold text-sm">Consultant Physiotherapist</p>
                                </div>
                                <div className="text-right">
                                    <p className="font-bold text-blue-800 flex items-center justify-end"><Icons.FileText /> +91 9641568109</p>
                                    <p className="text-sm font-semibold text-slate-600 mt-2">Date: <span className="underline">{today}</span></p>
                                </div>
                            </div>
                            <div className="flex flex-wrap justify-between items-center bg-blue-50 border border-blue-100 p-3 rounded mb-6 text-sm font-semibold">
                                <span className="w-full sm:w-auto mb-2 sm:mb-0"><span className="text-blue-800">Patient:</span> {prescriptionData.patientName || '________________'}</span>
                                <span><span className="text-blue-800">Age:</span> {prescriptionData.age || '____'}</span>
                                <span><span className="text-blue-800">Sex:</span> {prescriptionData.gender || '____'}</span>
                                <span><span className="text-blue-800">ID:</span> #{Math.floor(Math.random() * 9000) + 1000}</span>
                            </div>
                            {prescriptionData.complaint && (
                                <div className="mb-6">
                                    <h3 className="text-blue-800 font-bold text-sm mb-1">Diagnosis / Chief Complaint :-</h3>
                                    <p className="text-slate-800 text-sm pl-2">{prescriptionData.complaint}</p>
                                </div>
                            )}
                            <div className="flex-1">
                                <h3 className="text-blue-800 font-bold mb-4 text-lg border-b border-slate-200 pb-1">Prescribed Exercise Plan :-</h3>
                                <div className={`grid ${config.gridClass}`}>
                                    {prescribedExercises.map((ex, index) => (
                                        <div key={ex.id} className={`flex ${config.layout === 'row' ? 'flex-col sm:flex-row' : 'flex-col'} border border-slate-200 rounded-lg overflow-hidden break-inside-avoid bg-white`}>
                                            <div className={`${config.imgClass} shrink-0 bg-slate-50 flex items-center justify-center p-2`}>
                                                <img src={ex.imageUrl} alt={ex.name} className="max-w-full max-h-full object-contain rounded" />
                                            </div>
                                            <div className="p-3 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <h4 className={`font-bold text-slate-900 flex items-start ${config.titleClass}`}>
                                                        <span className="bg-blue-800 text-white rounded-full w-5 h-5 inline-flex items-center justify-center text-[10px] mr-1.5 shrink-0 mt-0.5">{index + 1}</span>
                                                        {ex.name}
                                                    </h4>
                                                    <p className={`text-slate-700 whitespace-pre-line ${config.textClass}`}>{ex.description}</p>
                                                </div>
                                                <div className={`bg-slate-50 border border-slate-200 rounded grid grid-cols-3 gap-1 text-center font-semibold text-slate-700 ${config.repsClass}`}>
                                                    <div><span className="block text-[8px] sm:text-[10px] text-slate-500 uppercase">Sets</span>3</div>
                                                    <div className="border-l border-r border-slate-200"><span className="block text-[8px] sm:text-[10px] text-slate-500 uppercase">Reps</span>10</div>
                                                    <div><span className="block text-[8px] sm:text-[10px] text-slate-500 uppercase">Freq</span>2x/Day</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="mt-8 pt-4 flex justify-end break-inside-avoid">
                                <div className="text-center">
                                    <div className="w-40 border-b border-slate-400 mb-1"></div>
                                    <p className="font-bold text-xs text-slate-800">Physiotherapist Signature</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <main>
                    <Header />
                    {currentView === 'home' && <HomeView />}
                    {currentView === 'exercise-list' && <PatientExerciseList />}
                    {currentView === 'exercise-detail' && <PatientExerciseDetail />}
                    {currentView === 'doctor-dashboard' && <DoctorDashboard />}
                    {currentView === 'print-prescription' && <PrintPrescriptionView />}
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
